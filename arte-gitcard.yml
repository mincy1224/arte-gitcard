schema-version: 2
cards:
  codebase:
    enabled: true
    languages:
      include_comments: false
  structure:
    enabled: true
    root: .
    max_depth: 3
    activity_days: 7
    commits:
      enabled: true
    changes:
      enabled: true
exclude:
  - node_modules
  - vendor
  - dist
  - build
  - coverage
  - .next
  - .nuxt
  - target
  - out
  - .cache
  - .github
  - package-lock.json
  - yarn.lock
  - pnpm-lock.yaml
  - composer.lock
  - Cargo.lock
  - Gemfile.lock
  - go.sum
  - poetry.lock
  - "*.min.js"
  - "*.min.css"
  - "*.map"
  - "*.lock"
theme: .arte-git-card/themes/github-theme.yml
output:
  directory: .github/arte-git-card
auto-update: true
